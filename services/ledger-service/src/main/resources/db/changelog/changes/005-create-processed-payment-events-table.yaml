databaseChangeLog:
  - changeSet:
      id: 005-create-processed-payment-events-table
      author: payflow
      changes:
        - createTable:
            tableName: processed_payment_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processed_payment_events
                    nullable: false
              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: merchant_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: VARCHAR(500)
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: processed_payment_events
            columnNames: payment_id
            constraintName: uk_processed_payment_events_payment_id

        - sql:
            sql: >
              ALTER TABLE processed_payment_events
              ADD CONSTRAINT chk_processed_payment_events_status
              CHECK (status IN ('SUCCESSFUL', 'FAILED'));

        - sql:
            sql: >
              ALTER TABLE processed_payment_events
              ADD CONSTRAINT chk_processed_payment_events_positive_amount
              CHECK (amount > 0);

        - sql:
            sql: >
              ALTER TABLE processed_payment_events
              ADD CONSTRAINT chk_processed_payment_events_currency
              CHECK (currency ~ '^[A-Z]{3}$');
