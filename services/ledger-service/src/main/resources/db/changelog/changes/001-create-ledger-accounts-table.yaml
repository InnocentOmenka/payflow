databaseChangeLog:
  - changeSet:
      id: 001-create-ledger-accounts-table
      author: payflow
      changes:
        - createTable:
            tableName: ledger_accounts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ledger_accounts
                    nullable: false

              - column:
                  name: account_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: account_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: ledger_accounts
            columnNames: account_code, currency
            constraintName: uk_ledger_account_code_currency

        - sql:
            sql: >
              ALTER TABLE ledger_accounts
              ADD CONSTRAINT chk_ledger_account_type
              CHECK (account_type IN
              ('ASSET', 'LIABILITY', 'EQUITY', 'REVENUE', 'EXPENSE'));

        - sql:
            sql: >
              ALTER TABLE ledger_accounts
              ADD CONSTRAINT chk_ledger_account_status
              CHECK (status IN ('ACTIVE', 'INACTIVE'));

        - sql:
            sql: >
              ALTER TABLE ledger_accounts
              ADD CONSTRAINT chk_ledger_account_currency
              CHECK (currency ~ '^[A-Z]{3}$');

        - createIndex:
            tableName: ledger_accounts
            indexName: idx_ledger_accounts_type_currency
            columns:
              - column:
                  name: account_type
              - column:
                  name: currency

        - createIndex:
            tableName: ledger_accounts
            indexName: idx_ledger_accounts_status
            columns:
              - column:
                  name: status

      rollback:
        - dropTable:
            tableName: ledger_accounts