databaseChangeLog:
  - changeSet:
      id: 001-create-notifications
      author: payflow
      changes:
        - sql:
            sql: |
              CREATE TABLE notifications (
                event_id UUID PRIMARY KEY,
                payment_id UUID NOT NULL UNIQUE,
                merchant_id VARCHAR(100) NOT NULL,
                event_type VARCHAR(30) NOT NULL CHECK (event_type = 'PaymentProcessed'),
                payment_status VARCHAR(20) NOT NULL CHECK (payment_status IN ('SUCCESSFUL', 'FAILED')),
                event_payload TEXT NOT NULL,
                webhook_payload TEXT NOT NULL,
                destination_ref VARCHAR(100) NOT NULL,
                delivery_state VARCHAR(20) NOT NULL DEFAULT 'PENDING'
                  CHECK (delivery_state IN ('PENDING', 'IN_FLIGHT', 'DELIVERED', 'FAILED')),
                attempt_count INTEGER NOT NULL DEFAULT 0 CHECK (attempt_count >= 0),
                next_attempt_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                claim_token UUID,
                lease_until TIMESTAMP WITH TIME ZONE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                delivered_at TIMESTAMP WITH TIME ZONE,
                last_failure VARCHAR(200),
                CHECK ((delivery_state = 'IN_FLIGHT' AND claim_token IS NOT NULL AND lease_until IS NOT NULL)
                  OR (delivery_state <> 'IN_FLIGHT' AND claim_token IS NULL AND lease_until IS NULL)),
                CHECK ((delivery_state = 'DELIVERED') = (delivered_at IS NOT NULL))
              );
              CREATE INDEX idx_notifications_due ON notifications(next_attempt_at, event_id)
                WHERE delivery_state = 'PENDING';
              CREATE INDEX idx_notifications_expired ON notifications(lease_until, event_id)
                WHERE delivery_state = 'IN_FLIGHT';
              CREATE TABLE notification_attempts (
                id UUID PRIMARY KEY,
                event_id UUID NOT NULL REFERENCES notifications(event_id),
                attempt_number INTEGER NOT NULL CHECK (attempt_number > 0),
                outcome VARCHAR(20) NOT NULL CHECK (outcome IN ('STARTED', 'DELIVERED', 'FAILED', 'LEASE_EXPIRED')),
                response_status INTEGER CHECK (response_status BETWEEN 100 AND 599),
                duration_ms BIGINT CHECK (duration_ms >= 0),
                failure_reason VARCHAR(200),
                started_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                finished_at TIMESTAMP WITH TIME ZONE,
                UNIQUE (event_id, attempt_number),
                CHECK ((outcome = 'STARTED') = (finished_at IS NULL))
              );
              CREATE INDEX idx_notification_attempts_event ON notification_attempts(event_id, attempt_number);
