spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYFLOW_JWT_ISSUER:http://localhost:8180/realms/payflow}
          jwk-set-uri: ${PAYFLOW_JWT_JWK_SET_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/certs}
          audiences: payflow-merchant-api
  application:
    name: merchant-service
  datasource:
    url: ${MERCHANT_DATABASE_URL:jdbc:postgresql://localhost:5432/payflow_merchant}
    username: ${MERCHANT_DATABASE_USERNAME:payflow_user}
    password: ${MERCHANT_DATABASE_PASSWORD:payflow_local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        max.block.ms: 5000
server:
  port: ${MERCHANT_SERVER_PORT:8086}
management:
  endpoint:
    health:
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        include: health,info
