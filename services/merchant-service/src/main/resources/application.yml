spring:
  application:
    name: merchant-service
  datasource:
    url: ${MERCHANT_DATABASE_URL:jdbc:postgresql://localhost:5432/payflow_merchant}
    username: ${MERCHANT_DATABASE_USERNAME:payflow_user}
    password: ${MERCHANT_DATABASE_PASSWORD:payflow_local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        max.block.ms: 5000
server:
  port: ${MERCHANT_SERVER_PORT:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info
