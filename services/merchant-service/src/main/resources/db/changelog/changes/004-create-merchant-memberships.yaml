databaseChangeLog:
  - changeSet:
      id: 004-create-merchant-memberships
      author: payflow
      changes:
        - sql:
            sql: |
              CREATE TABLE merchant_memberships (
                id UUID PRIMARY KEY,
                merchant_uuid UUID NOT NULL,
                issuer VARCHAR(512) COLLATE "C" NOT NULL,
                subject VARCHAR(255) COLLATE "C" NOT NULL,
                role VARCHAR(30) NOT NULL,
                active BOOLEAN NOT NULL,
                version BIGINT NOT NULL DEFAULT 0,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL,
                granted_by_issuer VARCHAR(512) NOT NULL,
                granted_by_subject VARCHAR(255) NOT NULL,
                changed_by_issuer VARCHAR(512) NOT NULL,
                changed_by_subject VARCHAR(255) NOT NULL,
                CONSTRAINT fk_memberships_merchant FOREIGN KEY (merchant_uuid) REFERENCES merchants(id),
                CONSTRAINT uk_memberships_principal UNIQUE (issuer, subject),
                CONSTRAINT chk_memberships_issuer CHECK (issuer ~ '[^[:space:]]'),
                CONSTRAINT chk_memberships_subject CHECK (subject ~ '[^[:space:]]'),
                CONSTRAINT chk_memberships_role CHECK (role IN ('MERCHANT_ADMIN', 'MERCHANT_OPERATOR')),
                CONSTRAINT chk_memberships_version CHECK (version >= 0),
                CONSTRAINT chk_memberships_timestamps CHECK (updated_at >= created_at),
                CONSTRAINT chk_memberships_grant_actor CHECK (
                  granted_by_issuer ~ '[^[:space:]]' AND granted_by_subject ~ '[^[:space:]]'),
                CONSTRAINT chk_memberships_change_actor CHECK (
                  changed_by_issuer ~ '[^[:space:]]' AND changed_by_subject ~ '[^[:space:]]')
              );
              CREATE INDEX idx_memberships_merchant ON merchant_memberships(merchant_uuid);
