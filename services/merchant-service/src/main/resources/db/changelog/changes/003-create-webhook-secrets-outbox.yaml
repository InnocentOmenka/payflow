databaseChangeLog:
  - changeSet:
      id: 003-create-webhook-secrets-outbox
      author: payflow
      changes:
        - sql:
            sql: |
              CREATE TABLE merchant_webhook_secrets (
                reference UUID PRIMARY KEY,
                merchant_uuid UUID NOT NULL REFERENCES merchants(id),
                version BIGINT NOT NULL CHECK (version > 0),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                UNIQUE(merchant_uuid,version),
                UNIQUE(merchant_uuid,reference,version)
              );
              ALTER TABLE merchant_webhooks ADD CONSTRAINT fk_webhook_secret
                FOREIGN KEY(merchant_uuid,secret_ref,secret_version) REFERENCES merchant_webhook_secrets(merchant_uuid,reference,version);
              CREATE TABLE merchant_config_outbox (
                event_id UUID PRIMARY KEY,
                merchant_id VARCHAR(100) NOT NULL,
                config_version BIGINT NOT NULL,
                payload TEXT NOT NULL,
                state VARCHAR(20) NOT NULL DEFAULT 'PENDING' CHECK(state IN ('PENDING','IN_FLIGHT','PUBLISHED','DEAD')),
                attempts INTEGER NOT NULL DEFAULT 0 CHECK(attempts>=0),
                next_attempt_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                lease_until TIMESTAMP WITH TIME ZONE,
                claim_token UUID,
                last_failure VARCHAR(100),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                published_at TIMESTAMP WITH TIME ZONE
              );
              CREATE INDEX idx_merchant_config_outbox_due ON merchant_config_outbox(next_attempt_at) WHERE state IN ('PENDING','IN_FLIGHT');
