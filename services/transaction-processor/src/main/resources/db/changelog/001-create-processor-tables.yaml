databaseChangeLog:
  - changeSet:
      id: 001-create-processed-payments
      author: payflow
      changes:
        - createTable:
            tableName: processed_payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: merchant_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: reference
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: failure_reason
                  type: VARCHAR(500)

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: processed_payments
            indexName: idx_processed_payments_merchant_id
            columns:
              - column:
                  name: merchant_id

  - changeSet:
      id: 002-create-processor-outbox-events
      author: payflow
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            tableName: outbox_events
            indexName: idx_processor_outbox_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at