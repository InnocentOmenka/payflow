spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: payment-create
              uri: ${PAYFLOW_PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/payments
                - Method=POST
            - id: payment-retrieve
              uri: ${PAYFLOW_PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/payments/{paymentId}
                - Method=GET
  http:
    clients:
      connect-timeout: ${PAYFLOW_GATEWAY_CONNECT_TIMEOUT:2s}
      read-timeout: ${PAYFLOW_GATEWAY_RESPONSE_TIMEOUT:3s}
      redirects: dont-follow
      imperative:
        factory: jdk
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYFLOW_JWT_ISSUER:http://localhost:8180/realms/payflow}
          jwk-set-uri: ${PAYFLOW_JWT_JWK_SET_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/certs}
          audiences: ${PAYFLOW_GATEWAY_JWT_AUDIENCE:payflow-payment-api}

server:
  port: ${GATEWAY_SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        include: health
