
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYFLOW_JWT_ISSUER:http://localhost:8180/realms/payflow}
          jwk-set-uri: ${PAYFLOW_JWT_JWK_SET_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/certs}
          audiences: payflow-payment-api
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payflow_payment
    username: payflow_user
    password: payflow_local_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
        ack-mode: manual


payflow:
  merchant-access:
    base-url: ${PAYFLOW_MERCHANT_BASE_URL:http://localhost:8086}
    token-uri: ${PAYFLOW_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}
    client-secret: ${PAYFLOW_PAYMENT_SERVICE_SECRET:}

server:
  port: 8081

management:
  endpoint:
    health:
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        include: health,info
