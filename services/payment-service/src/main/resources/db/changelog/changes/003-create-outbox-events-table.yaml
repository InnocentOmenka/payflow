
databaseChangeLog:
  - changeSet:
      id: 003-create-outbox-events-table
      author: payflow
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_aggregate_id
            columns:
              - column:
                  name: aggregate_id
