databaseChangeLog:
  - changeSet:
      id: 002-create-idempotency-records-table
      author: payflow
      changes:
        - createTable:
            tableName: idempotency_records
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_idempotency_records
                    nullable: false

              - column:
                  name: merchant_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: idempotency_records
            columnNames: merchant_id, idempotency_key
            constraintName: uk_idempotency_merchant_key

        - addUniqueConstraint:
            tableName: idempotency_records
            columnNames: payment_id
            constraintName: uk_idempotency_payment_id

        - addForeignKeyConstraint:
            baseTableName: idempotency_records
            baseColumnNames: payment_id
            referencedTableName: payments
            referencedColumnNames: id
            constraintName: fk_idempotency_payment