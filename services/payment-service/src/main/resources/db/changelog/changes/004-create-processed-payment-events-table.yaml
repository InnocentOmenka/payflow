databaseChangeLog:
  - changeSet:
      id: 004-create-processed-payment-events-table
      author: payflow
      changes:
        - createTable:
            tableName: processed_payment_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processed_payment_events
                    nullable: false

              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: processed_payment_events
            indexName: idx_processed_payment_events_payment_id
            columns:
              - column:
                  name: payment_id