spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payflow_payment
    username: payflow_user
    password: payflow_local_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info