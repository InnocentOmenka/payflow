databaseChangeLog:
  - changeSet:
      id: 001-create-payments-table
      author: payflow
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
                    nullable: false

              - column:
                  name: merchant_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: reference
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: payments
            columnNames: merchant_id, reference
            constraintName: uk_payments_merchant_reference

        - createIndex:
            tableName: payments
            indexName: idx_payments_merchant_id
            columns:
              - column:
                  name: merchant_id