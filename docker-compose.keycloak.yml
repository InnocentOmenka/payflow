# Standalone development stack. Never combine with docker-compose.yml.
name: payflow-identity
services:
  keycloak-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set a private development database password}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [identity]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set a private development database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set a local bootstrap admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a private bootstrap password}
      PAYFLOW_PAYMENT_SERVICE_SECRET: ${PAYFLOW_PAYMENT_SERVICE_SECRET:?Set a private machine-client secret}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak/payflow-realm.json:/opt/keycloak/data/import/payflow-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [identity]
networks:
  identity:
volumes:
  keycloak-postgres-data:
